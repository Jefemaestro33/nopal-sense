  <text class="section" x="392" y="186">Analog Front-End</text>
  <rect class="block" x="368" y="206" rx="6" ry="6" width="220" height="38"/>
  <text class="small" x="413" y="230">DDS / NCO</text>
  <rect class="block" x="368" y="257" rx="6" ry="6" width="220" height="38"/>
  <text class="small" x="392" y="281">DAC + electrode driver</text>
  <rect class="block" x="368" y="308" rx="6" ry="6" width="220" height="38"/>
  <text class="small" x="405" y="332">TIA / PGA readout</text>
  <rect class="block" x="368" y="359" rx="6" ry="6" width="220" height="38"/>
  <text class="small" x="404" y="383">I/Q demod + LPF</text>
  <rect class="block" x="368" y="410" rx="6" ry="6" width="220" height="38"/>
  <text class="small" x="407" y="434">ADC / MUX access</text>

  <rect class="ctx" x="652" y="152" rx="8" ry="8" width="284" height="144"/>
  <text class="section" x="707" y="186">Measurement Quality</text>
  <rect class="block" x="680" y="206" rx="6" ry="6" width="228" height="36"/>
  <text class="small" x="709" y="229">contact / health check</text>
  <rect class="block" x="680" y="250" rx="6" ry="6" width="228" height="36"/>
  <text class="small" x="708" y="273">calibration reference path</text>

  <rect class="dig" x="652" y="322" rx="8" ry="8" width="284" height="144"/>
  <text class="section" x="705" y="356">Digital Control</text>
  <rect class="block" x="680" y="376" rx="6" ry="6" width="228" height="36"/>
  <text class="small" x="724" y="399">sweep scheduler</text>
  <rect class="block" x="680" y="420" rx="6" ry="6" width="228" height="36"/>
  <text class="small" x="718" y="443">SPI registers / flags</text>

  <path class="line" d="M238 212 L296 197"/>
  <path class="line" d="M318 265 L238 242"/>
  <path class="thin" d="M238 422 L296 431"/>
  <path class="wire" d="M318 197 L348 197"/>
  <path class="wire" d="M318 265 L348 265"/>
  <path class="thin" d="M588 276 L650 224"/>
  <path class="thin" d="M588 429 L650 394"/>
  <path class="thin" d="M794 296 L794 322"/>

  <rect class="ext" x="1070" y="202" rx="8" ry="8" width="156" height="126"/>
  <text class="section" x="1111" y="242">ESP32</text>
  <text class="small" x="1104" y="274">host control</text>
  <text class="small" x="1104" y="302">data logging</text>
  <path class="line" d="M986 268 L1070 268"/>

  <rect class="callout" x="1070" y="378" rx="8" ry="8" width="156" height="86"/>
  <text class="section" x="1106" y="412">Outputs</text>
  <text class="small" x="1094" y="442">impedance + flags</text>

  <path class="thin" d="M986 414 L1070 414"/>

</svg>
